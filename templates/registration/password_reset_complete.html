{% extends 'shop/base.html' %}
{% load shop_extras %}

{% block title %}Пароль изменён — GameZone{% endblock %}

{% block content %}
  <section class="section">
    <div class="container">
      <div class="success-card">
        <span class="success-icon">{% icon 'check-circle' 56 %}</span>
        <h1 class="success-title">Пароль изменён</h1>
        <p class="success-text">Теперь можно войти в аккаунт с новым паролем.</p>
        <div class="success-actions">
          <a class="btn btn-primary btn-lg" href="{% url 'shop:login' %}">{% icon 'log-in' 18 %} Войти</a>
          <a class="btn btn-ghost btn-lg" href="{% url 'shop:home' %}">На главную</a>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
