services:
  - type: web
    name: gamezone
    runtime: python
    plan: free

    buildCommand: >-
      pip install -r requirements-prod.txt &&
      python manage.py collectstatic --noinput

    startCommand: >-
      python manage.py db_status &&
      python manage.py migrate --noinput &&
      python manage.py seed_data --if-empty &&
      python manage.py ensure_admin &&
      gunicorn gamezone.wsgi:application --bind 0.0.0.0:$PORT --workers 2

    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_DATABASE_URL
        sync: false
