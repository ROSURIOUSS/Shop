{% load l10n shop_extras %}
{% if value %}<span class="stars" style="--rating: {{ value|unlocalize }}" role="img"
      aria-label="Оценка {{ value|floatformat:1 }} из 5"><span class="stars__base" aria-hidden="true">{% for star in "12345" %}{% icon 'star' star_size|default:14 %}{% endfor %}</span><span class="stars__fill" aria-hidden="true">{% for star in "12345" %}{% icon 'star' star_size|default:14 %}{% endfor %}</span></span>{% endif %}
